<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahan - Meus Estudos</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { overflow: hidden; }
        .app-layout { display: flex; height: 100vh; width: 100vw; }

        /* PAINEL ESQUERDO */
        .painel-esquerdo {
            width: 150px; background: #2c3e50; color: white;
            display: flex; flex-direction: column; flex-shrink: 0;
            padding: 15px 10px; gap: 8px;
        }
        .painel-esquerdo .logo {
            font-size: 0.95rem; font-weight: 700; text-align: center;
            padding: 8px 0; border-bottom: 1px solid #34495e; margin-bottom: 5px;
        }
        .painel-esquerdo button {
            background: transparent; color: #ecf0f1; border: 1px solid #34495e;
            border-radius: 6px; padding: 10px 8px; cursor: pointer;
            font-size: 0.85rem; font-weight: 600; transition: 0.2s; text-align: center;
        }
        .painel-esquerdo button:hover { background: #34495e; }
        .painel-esquerdo button.ativo { background: #1abc9c; border-color: #1abc9c; color: white; }
        .painel-esquerdo button.primario { background: #1abc9c; border-color: #1abc9c; color: white; }
        .painel-esquerdo button.primario:hover { background: #16a085; }
        .painel-esquerdo .espaco-flex { flex: 1; }

        /* PAINEL DIREITO */
        .painel-direito { flex: 1; display: flex; flex-direction: column; background: #f4f7f6; overflow: hidden; }
        .parte-superior {
            height: 55vh; flex-shrink: 0; background: #fafcfb;
            border-bottom: 2px solid #ecf0f1; overflow: hidden; position: relative;
        }
        .parte-inferior { flex: 1; overflow-y: auto; padding: 25px 30px; background: white; }
        .parte-inferior .bem-vindo-conteudo { text-align: center; color: #7f8c8d; margin-top: 60px; }

        /* MINHA CONTA */
        .minha-conta-wrap { height: 100%; overflow-y: auto; padding: 25px 35px; }
        .minha-conta-dados {
            background: white; border-radius: 10px; padding: 20px 25px;
            margin-bottom: 25px; box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .minha-conta-dados .campo { margin-bottom: 10px; }
        .minha-conta-dados .campo label {
            display: block; font-size: 0.78rem; color: #7f8c8d;
            text-transform: uppercase; font-weight: 700; margin-bottom: 3px;
        }
        .minha-conta-dados .campo .valor { font-size: 1rem; color: #2c3e50; }
        .minha-conta-cats-titulo { font-size: 1rem; font-weight: 700; color: #2c3e50; margin-bottom: 12px; }
        .lista-categorias {
            background: white; border-radius: 10px; padding: 15px 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .cat-linha {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 0; border-bottom: 1px solid #f0f3f2;
        }
        .cat-linha:last-child { border-bottom: none; }
        .cat-linha input {
            flex: 1; padding: 8px 10px; border: 1px solid #ecf0f1;
            border-radius: 6px; font-size: 0.9rem; background: #fafcfb; transition: 0.15s;
        }
        .cat-linha input:focus { outline: none; border-color: #1abc9c; background: white; }
        .cat-linha .btn-acao {
            background: transparent; border: none; cursor: pointer;
            font-size: 0.95rem; padding: 4px 6px; color: #7f8c8d; border-radius: 4px;
        }
        .cat-linha .btn-acao:hover { background: #ecf0f1; }
        .cat-linha .btn-acao.excluir:hover { color: #e74c3c; background: #fdf0ef; }
        .btn-nova-categoria {
            background: #ecf0f1; border: 2px dashed #bdc3c7; color: #2c3e50;
            padding: 10px; width: 100%; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 0.85rem; margin-top: 10px; transition: 0.2s;
        }
        .btn-nova-categoria:hover { background: #e0e6e6; border-color: #1abc9c; color: #1abc9c; }

        /* MAPA */
        .mapa-controles-flutuante {
            position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 10;
        }
        .mapa-controles-flutuante button {
            background: white; border: 1px solid #ecf0f1; border-radius: 6px;
            width: 34px; height: 34px; cursor: pointer; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06); transition: 0.2s;
        }
        .mapa-controles-flutuante button:hover {
            background: #1abc9c; color: white; border-color: #1abc9c;
        }
        #mapa-svg { width: 100%; height: 100%; cursor: grab; display: block; }
        #mapa-svg:active { cursor: grabbing; }
        .node circle { stroke-width: 2.5px; cursor: pointer; transition: all 0.3s; }
        .node.status-adicionado circle { fill: #95a5a6; stroke: #7f8c8d; }
        .node.status-em_estudo circle  { fill: #f1c40f; stroke: #f39c12;
            filter: drop-shadow(0 0 10px #f1c40f) drop-shadow(0 0 20px #f1c40f); }
        .node.status-concluido circle  { fill: #27ae60; stroke: #1e8449; }
        .node.selecionado circle {
            stroke-width: 4px; filter: drop-shadow(0 0 8px rgba(231, 76, 60, 0.7));
        }
        .node.raiz circle { stroke-width: 3.5px; }
        .node text.nome-no {
            font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600;
            fill: #2c3e50; pointer-events: none; user-select: none;
        }
        .node.raiz text.nome-no { font-size: 13px; font-weight: 700; }
        .node text.porcentagem-no {
            font-family: 'Segoe UI', sans-serif; font-size: 9px; font-weight: 700;
            fill: #ffffff; pointer-events: none; user-select: none;
        }
        .node.raiz text.porcentagem-no { font-size: 11px; }
        .link { fill: none; stroke: #bdc3c7; stroke-width: 1.5px; }

        /* LISTA */
        .lista-scroll { height: 100%; overflow-y: auto; padding: 20px 30px; }
        .lista-plano { margin-bottom: 14px; }
        .lista-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: 0.15s;
        }
        .lista-item:hover { background: #ecf0f1; }
        .lista-item .nome-flex { flex: 1; }
        .lista-item .btn-add-small, .lista-item .btn-edit-small,
        .lista-item .btn-menu-small, .lista-item .btn-del { visibility: visible; }
        .lista-plano > .lista-item { font-size: 1.05rem; font-weight: 700; color: #2c3e50; }
        .lista-materia { margin-left: 20px; }
        .lista-materia > .lista-item { font-size: 0.98rem; font-weight: 600; color: #16a085; }
        .lista-topico { margin-left: 45px; }
        .lista-topico > .lista-item { font-size: 0.92rem; color: #d68910; }
        .lista-subtopico { margin-left: 70px; }
        .lista-subtopico > .lista-item { font-size: 0.88rem; color: #7f8c8d; }
        .lista-subtopico > .lista-item.ativo { background: #d1f2eb; color: #0e6655; font-weight: 600; }
        .status-pill {
            font-size: 0.7rem; padding: 2px 8px; border-radius: 10px;
            font-weight: 600; flex-shrink: 0;
        }
        .status-pill.adicionado { background: #ecf0f1; color: #7f8c8d; }
        .status-pill.em_estudo  { background: #fef5d4; color: #b7950b; }
        .status-pill.concluido  { background: #d4efdf; color: #1e8449; }
        .badge-categoria {
            font-size: 0.68rem; background: #f0f3f2; color: #7f8c8d;
            padding: 2px 8px; border-radius: 10px; font-weight: 600; flex-shrink: 0;
        }

        /* BOTÕES PEQUENOS */
        .btn-add-small, .btn-edit-small, .btn-menu-small {
            background: transparent; border: 1px solid #bdc3c7; color: #7f8c8d;
            border-radius: 4px; width: 22px; height: 22px; font-size: 0.75rem;
            line-height: 1; cursor: pointer; padding: 0; flex-shrink: 0;
        }
        .btn-add-small:hover, .btn-edit-small:hover, .btn-menu-small:hover {
            background: #1abc9c; border-color: #1abc9c; color: white;
        }
        .btn-del {
            background: transparent; border: none; color: #e74c3c;
            cursor: pointer; font-size: 0.85rem; padding: 0 4px; flex-shrink: 0;
        }
        .btn-del:hover { color: #c0392b; }

        /* DROPDOWN */
        .dropdown-status {
            position: fixed; background: white; border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.18); padding: 6px;
            z-index: 2000; min-width: 230px; animation: fadeIn 0.15s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .dropdown-status .item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: 6px; cursor: pointer;
            font-size: 0.88rem; color: #2c3e50; user-select: none;
        }
        .dropdown-status .item:hover { background: #f4f7f6; }
        .dropdown-status .item .check { margin-left: auto; color: #1abc9c; font-weight: 700; }
        .dropdown-status .separador { height: 1px; background: #ecf0f1; margin: 5px 8px; }
        .dropdown-status .item.perigo { color: #e74c3c; }
        .dropdown-status .item.perigo:hover { background: #fdf0ef; }
        .dropdown-status .item.add { color: #1abc9c; font-weight: 600; }

        /* SUBMENU DE CORES */
        .dropdown-status .cores-grid {
            display: flex; gap: 8px; padding: 10px 12px;
            flex-wrap: wrap; justify-content: center;
        }
        .dropdown-status .cor-bolinha {
            width: 28px; height: 28px; border-radius: 50%;
            cursor: pointer; border: 2px solid transparent; transition: 0.15s;
        }
        .dropdown-status .cor-bolinha:hover { transform: scale(1.15); }
        .dropdown-status .cor-bolinha.ativa {
            border-color: #2c3e50; box-shadow: 0 0 0 2px white inset;
        }
        .dropdown-status .voltar-submenu {
            padding: 6px 12px; font-size: 0.8rem; color: #7f8c8d;
            cursor: pointer; border-radius: 6px;
        }
        .dropdown-status .voltar-submenu:hover { background: #f4f7f6; }

        /* CONTEÚDO */
        #titulo-subtopico {
            font-size: 1.25rem; color: #2c3e50; margin-bottom: 15px;
            border-bottom: 2px solid #1abc9c; padding-bottom: 8px;
        }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            padding: 8px 16px; border: none; background: #ecf0f1;
            cursor: pointer; border-radius: 6px; font-weight: 600;
            font-size: 0.85rem; color: #7f8c8d; transition: 0.2s;
        }
        .tab-btn.active { background: #1abc9c; color: white; }
        .tab-content { display: none; line-height: 1.6; }
        .tab-content.active { display: block; }
        .conteudo-bloco {
            padding: 14px 16px; background: #f9fbfa;
            border-left: 4px solid #1abc9c; border-radius: 6px;
            margin-bottom: 12px; position: relative;
        }
        .conteudo-bloco h4 { margin-bottom: 6px; color: #2c3e50; font-size: 0.95rem; }
        .conteudo-bloco p { font-size: 0.92rem; color: #34495e; }
        .conteudo-bloco a { color: #1abc9c; text-decoration: none; font-size: 0.92rem; }
        .conteudo-bloco a:hover { text-decoration: underline; }
        .conteudo-bloco .btn-del { position: absolute; top: 8px; right: 8px; }
        .tab-add-btn {
            background: #ecf0f1; color: #2c3e50; border: 2px dashed #bdc3c7;
            padding: 12px; width: 100%; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 0.9rem; margin-top: 10px;
        }
        .tab-add-btn:hover { background: #e0e6e6; border-color: #1abc9c; color: #1abc9c; }

        /* MODAIS */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center; z-index: 3000;
        }
        .modal-box {
            background: white; padding: 30px; border-radius: 12px;
            width: 480px; max-width: 90%; max-height: 90vh; overflow-y: auto;
        }
        .modal-box h3 { margin-bottom: 20px; color: #2c3e50; }
        .modal-box label {
            display: block; font-size: 0.8rem; color: #7f8c8d;
            text-transform: uppercase; font-weight: 700; margin: 12px 0 4px;
        }
        .modal-box input, .modal-box textarea, .modal-box select {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 0.95rem; font-family: inherit; background: white;
        }
        .modal-box textarea { min-height: 90px; resize: vertical; }
        .modal-acoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn {
            padding: 10px 18px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 600; font-size: 0.9rem;
        }
        .btn-primary { background: #1abc9c; color: white; }
        .btn-primary:hover { background: #16a085; }
        .btn-secondary { background: #ecf0f1; color: #2c3e50; }
        .btn-secondary:hover { background: #d5dbdb; }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="painel-esquerdo">
            <div class="logo">📚 Meus Estudos</div>
            <button id="btn-modo-mapa" class="ativo" onclick="mudarModo('mapa')">🗺️ Mapa</button>
            <button id="btn-modo-lista" onclick="mudarModo('lista')">📋 Lista</button>
            <button id="btn-modo-conta" onclick="mudarModo('conta')">👤 Minha Conta</button>
            <div class="espaco-flex"></div>
            <button class="primario" onclick="criarPlano()">+ Novo Plano</button>
            <button onclick="logout()">Sair</button>
        </aside>

        <div class="painel-direito">
            <div class="parte-superior" id="parte-superior">

                <div class="minha-conta-wrap" id="conta-container" style="display:none;">
                    <div class="minha-conta-dados">
                        <div class="campo"><label>Nome</label><div class="valor" id="conta-nome">—</div></div>
                        <div class="campo"><label>Email</label><div class="valor" id="conta-email">—</div></div>
                    </div>
                    <div class="minha-conta-cats-titulo">🏷️ Categorias</div>
                    <div class="lista-categorias" id="lista-categorias"></div>
                    <button class="btn-nova-categoria" onclick="adicionarCategoriaVazia()">+ Nova categoria</button>
                </div>

                <div class="vazio-parte-superior" id="vazio-superior" style="text-align:center; color:#7f8c8d; margin-top:120px;">
                    <h2 style="color:#bdc3c7; font-size:1.3rem;">Nenhum plano selecionado</h2>
                    <p style="margin-top:8px; font-size:0.9rem;">Clique em um plano na lista ou crie um novo.</p>
                </div>

                <div class="mapa-controles-flutuante" id="mapa-controles" style="display:none;">
                    <button onclick="zoomIn()" title="Zoom +">＋</button>
                    <button onclick="zoomOut()" title="Zoom −">−</button>
                    <button onclick="resetZoom()" title="Resetar">⟲</button>
                    <button onclick="expandirTudo()" title="Expandir tudo">⤢</button>
                    <button onclick="colapsarTudo()" title="Colapsar tudo">⤡</button>
                </div>

                <svg id="mapa-svg" style="display:none;"></svg>
                <div class="lista-scroll" id="lista-container" style="display:none;"></div>
            </div>

            <div class="parte-inferior" id="parte-inferior">
                <div class="bem-vindo-conteudo" id="bem-vindo-conteudo">
                    <h3>📖 Conteúdo do subtópico</h3>
                    <p>Selecione um subtópico acima para ver o material, resumo, links e PDFs.</p>
                </div>
                <div id="conteudo-area" style="display:none;">
                    <h2 id="titulo-subtopico"></h2>
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="material">📖 Material</button>
                        <button class="tab-btn" data-tab="resumo">📝 Resumo</button>
                        <button class="tab-btn" data-tab="link">🔗 Links</button>
                        <button class="tab-btn" data-tab="pdf">📄 PDFs</button>
                    </div>
                    <div id="tab-material" class="tab-content active"></div>
                    <div id="tab-resumo" class="tab-content"></div>
                    <div id="tab-link" class="tab-content"></div>
                    <div id="tab-pdf" class="tab-content"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal" style="display:none;">
        <div class="modal-box">
            <h3 id="modal-titulo"></h3>
            <div id="modal-campos"></div>
            <div class="modal-acoes">
                <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="confirmarModal()">Criar</button>
            </div>
        </div>
    </div>

    <div id="modal-editar" class="modal" style="display:none;">
        <div class="modal-box">
            <h3 id="modal-editar-titulo">Editar</h3>
            <div id="modal-editar-campos"></div>
            <div class="modal-acoes">
                <button class="btn btn-secondary" onclick="fecharModalEditar()">Cancelar</button>
                <button class="btn btn-primary" onclick="confirmarModalEditar()">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modal-conteudo" class="modal" style="display:none;">
        <div class="modal-box">
            <h3 id="modal-conteudo-titulo">Adicionar Conteúdo</h3>
            <div id="modal-conteudo-campos"></div>
            <div class="modal-acoes">
                <button class="btn btn-secondary" onclick="fecharModalConteudo()">Cancelar</button>
                <button class="btn btn-primary" onclick="confirmarModalConteudo()">Adicionar</button>
            </div>
        </div>
    </div>

    <div id="modal-categorias" class="modal" style="display:none;">
        <div class="modal-box">
            <h3>🏷️ Categorias</h3>
            <div class="lista-categorias" id="modal-categorias-lista"></div>
            <button class="btn-nova-categoria" onclick="adicionarCategoriaVazia()">+ Nova categoria</button>
            <div class="modal-acoes">
                <button class="btn btn-primary" onclick="fecharModalCategorias()">Pronto</button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        // ==========================================
        // ESTADO
        // ==========================================
        let USUARIO = null;
        let ARVORE = [];
        let CATEGORIAS = [];
        let PLANO_ATUAL = null;
        let SUBTOPICO_ATUAL = null;
        let TIPO_CRIACAO = null;
        let CONTEXTO_CRIACAO = null;
        let TIPO_CONTEUDO = null;
        let MODO = 'mapa';

        let EDITANDO = null;
        let CATEGORIA_VOLTAR_PARA_MODAL = false;

        // Estado da árvore (pra preservar expand/collapse ao re-renderizar)
        let NOS_EXPANDIDOS = new Set(); // guarda os IDs lógicos dos nós que estão abertos

        let svg, g, zoomBehavior, treeLayout, root;
        let i = 0;

        const CORES_DISPONIVEIS = [
            { hex: '#8e44ad', nome: 'Roxo' },
            { hex: '#d4af37', nome: 'Dourado' },
            { hex: '#2980b9', nome: 'Azul' },
            { hex: '#27ae60', nome: 'Verde' },
            { hex: '#e74c3c', nome: 'Vermelho' },
            { hex: '#e91e63', nome: 'Rosa' },
        ];

        // ==========================================
        // INIT
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            USUARIO = protegerRota('aluno');
            if (!USUARIO) return;

            atualizarDadosContaNaTela();
            await carregarCategorias();
            await carregarArvore();

            document.addEventListener('click', () => fecharDropdown());
        });

        function atualizarDadosContaNaTela() {
            document.getElementById('conta-nome').innerText = USUARIO.nome;
            document.getElementById('conta-email').innerText = USUARIO.email;
        }

        async function carregarArvore() {
            const resp = await apiFetch('/api/estudos/arvore');
            if (!resp) return;
            ARVORE = await resp.json();

            if (PLANO_ATUAL) {
                const atualizado = ARVORE.find(p => p.id === PLANO_ATUAL.id);
                if (atualizado) {
                    PLANO_ATUAL = atualizado;
                    if (SUBTOPICO_ATUAL) {
                        const subAtual = encontrarSubtopico(SUBTOPICO_ATUAL.id);
                        if (subAtual) {
                            SUBTOPICO_ATUAL = subAtual;
                            renderizarConteudos(subAtual);
                        }
                    }
                } else {
                    PLANO_ATUAL = null;
                    SUBTOPICO_ATUAL = null;
                }
            }

            renderizarModoAtual();
        }

        async function carregarCategorias() {
            const resp = await apiFetch('/api/estudos/categorias');
            if (!resp) return;
            CATEGORIAS = await resp.json();
            renderizarListaCategorias();
            renderizarListaCategoriasModal();
        }

        // ==========================================
        // NAVEGAÇÃO DE MODO
        // ==========================================
        function mudarModo(novoModo) {
            MODO = novoModo;
            ['mapa', 'lista', 'conta'].forEach(m => {
                const btn = document.getElementById(`btn-modo-${m}`);
                if (btn) btn.classList.toggle('ativo', m === novoModo);
            });
            renderizarModoAtual();
        }

        function renderizarModoAtual() {
            const vazio = document.getElementById('vazio-superior');
            const svgEl = document.getElementById('mapa-svg');
            const listaEl = document.getElementById('lista-container');
            const contaEl = document.getElementById('conta-container');
            const controles = document.getElementById('mapa-controles');

            vazio.style.display = 'none';
            svgEl.style.display = 'none';
            listaEl.style.display = 'none';
            contaEl.style.display = 'none';
            controles.style.display = 'none';

            if (MODO === 'conta') {
                contaEl.style.display = 'block';
                return;
            }

            if (MODO === 'mapa') {
                // Mapa agora sempre renderiza (com raiz do aluno mesmo sem plano selecionado)
                svgEl.style.display = 'block';
                controles.style.display = 'flex';
                renderizarMapa();
            } else {
                if (!ARVORE.length) {
                    vazio.style.display = 'block';
                    return;
                }

        // ==========================================
        // MAPA (D3) — com raiz do aluno
        // ==========================================
        function corDaRaiz() {
            return (USUARIO && USUARIO.cor_raiz) || '#8e44ad';
        }

        function calcularPorcentagemGeral() {
            // Média ponderada: total de subtópicos concluídos / total de subtópicos
            let total = 0;
            let concluidos = 0;
            ARVORE.forEach(plano => {
                plano.materias.forEach(mat => {
                    mat.topicos.forEach(top => {
                        top.subtopicos.forEach(sub => {
                            total++;
                            if (sub.status === 'concluido') concluidos++;
                        });
                    });
                });
            });
            if (total === 0) return 0;
            return Math.round((concluidos / total) * 100);
        }

        function statusGeral() {
            const pct = calcularPorcentagemGeral();
            if (pct === 0) return 'adicionado';
            if (pct === 100) return 'concluido';
            return 'em_estudo';
        }

                function colapsarNo(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(colapsarNo);
                d.children = null;
            }
        }

        function quebrarTexto(texto, maxCharsPorLinha = 16, maxLinhas = 3) {
            if (!texto) return [''];
            const palavras = texto.split(/\s+/);
            const linhas = [];
            let linhaAtual = '';

            for (const palavra of palavras) {
                const tentativa = linhaAtual ? linhaAtual + ' ' + palavra : palavra;
                if (tentativa.length <= maxCharsPorLinha) {
                    linhaAtual = tentativa;
                } else {
                    if (linhaAtual) linhas.push(linhaAtual);
                    linhaAtual = palavra;
                    if (linhas.length === maxLinhas - 1) break;
                }
            }
            if (linhaAtual && linhas.length < maxLinhas) linhas.push(linhaAtual);
            if (linhas.length === maxLinhas) {
                const ultima = linhas[maxLinhas - 1];
                if (ultima.length > maxCharsPorLinha) {
                    linhas[maxLinhas - 1] = ultima.slice(0, maxCharsPorLinha - 1) + '…';
                }
            }
            return linhas;
        }



        function renderizarMapa() {
            const pct = calcularPorcentagemGeral();
            const hierarquia = {
                id: 'raiz',
                nome: USUARIO.nome,
                tipo: 'raiz',
                refId: null,
                status: statusGeral(),
                porcentagem: pct,
                children: ARVORE.map(plano => ({
                    id: `plano-${plano.id}`,
                    nome: plano.nome,
                    tipo: 'plano',
                    refId: plano.id,
                    status: plano.status,
                    porcentagem: plano.porcentagem,
                    children: plano.materias.map(mat => ({
                        id: `mat-${mat.id}`, nome: mat.nome, tipo: 'materia', refId: mat.id,
                        status: mat.status, porcentagem: mat.porcentagem,
                        children: mat.topicos.map(top => ({
                            id: `top-${top.id}`,
                            nome: `${top.numero || ''} ${top.nome}`.trim(),
                            tipo: 'topico', refId: top.id,
                            status: top.status, porcentagem: top.porcentagem,
                            children: top.subtopicos.map(sub => ({
                                id: `sub-${sub.id}`,
                                nome: `${sub.numero || ''} ${sub.nome}`.trim(),
                                tipo: 'subtopico', refId: sub.id,
                                status: sub.status, porcentagem: sub.porcentagem,
                            }))
                        }))
                    }))
                }))
            };

            const svgEl = document.getElementById('mapa-svg');
            d3.select(svgEl).selectAll('*').remove();

            const width = svgEl.clientWidth || 900;
            const height = svgEl.clientHeight || 400;

            svg = d3.select(svgEl).attr('viewBox', [0, 0, width, height]);
            g = svg.append('g');

            zoomBehavior = d3.zoom()
                .scaleExtent([0.2, 3])
                .on('zoom', (event) => g.attr('transform', event.transform));

            svg.call(zoomBehavior);

            treeLayout = d3.tree()
                .size([height - 80, width - 200])
                .separation((a, b) => (a.parent === b.parent ? 1.2 : 1.6));

            root = d3.hierarchy(hierarquia, d => d.children);
            root.x0 = height / 2;
            root.y0 = 0;

            // Restaura estado de expand/collapse: colapsa tudo que NÃO está em NOS_EXPANDIDOS
            // Por padrão (se nada foi expandido ainda), os planos ficam colapsados
            root.each(d => {
                if (d.children && d.depth >= 1) {
                    if (!NOS_EXPANDIDOS.has(d.data.id)) {
                        d._children = d.children;
                        d.children = null;
                    }
                }
            });

            atualizarMapa(root);
        }

        function atualizarMapa(source) {
            const svgEl = document.getElementById('mapa-svg');
            const height = svgEl.clientHeight || 400;
            const duration = 400;
            const treeData = treeLayout(root);
            const nodes = treeData.descendants();
            const links = treeData.links();

            nodes.forEach(d => { d.y = d.depth * 220; });

            // LINKS
            const link = g.selectAll('path.link').data(links, d => d.target.id);
            const linkEnter = link.enter().insert('path', 'g')
                .attr('class', 'link')
                .attr('d', () => {
                    const o = { x: source.x0, y: source.y0 };
                    return diagonal(o, o);
                });
            link.merge(linkEnter).transition().duration(duration)
                .attr('d', d => diagonal(d.source, d.target));
            link.exit().transition().duration(duration)
                .attr('d', () => {
                    const o = { x: source.x, y: source.y };
                    return diagonal(o, o);
                }).remove();

            // NODES
            const node = g.selectAll('g.node').data(nodes, d => d.id || (d.id = ++i));

            const nodeEnter = node.enter().append('g')
                .attr('class', d => {
                    let cls = `node nivel-${d.data.tipo} status-${d.data.status || 'adicionado'}`;
                    if (d.data.tipo === 'raiz') cls += ' raiz';
                    if (SUBTOPICO_ATUAL && d.data.tipo === 'subtopico' && d.data.refId === SUBTOPICO_ATUAL.id) cls += ' selecionado';
                    return cls;
                })
                .attr('transform', () => `translate(${source.y0},${source.x0})`)
                .on('click', (event, d) => { event.stopPropagation(); clicarNo(d); })
                .on('contextmenu', (event, d) => {
                    event.preventDefault();
                    event.stopPropagation();
                    if (d.data.tipo === 'raiz') {
                        abrirDropdownRaiz(event);
                    } else {
                        abrirDropdown(event, d.data.tipo, d.data.refId, d.data.status || 'adicionado');
                    }
                });

            nodeEnter.append('circle').attr('r', 1e-6);

            // Aplica cor customizada na raiz
            nodeEnter.filter(d => d.data.tipo === 'raiz')
                .select('circle')
                .style('fill', corDaRaiz())
                .style('stroke', corDaRaiz());

            nodeEnter.each(function(d) {
                const linhas = quebrarTexto(d.data.nome, d.data.tipo === 'raiz' ? 18 : 16, 3);
                const textoEl = d3.select(this).append('text')
                    .attr('class', 'nome-no').attr('text-anchor', 'middle').attr('x', 0);
                // Raiz tem bolinha maior (r=28), então precisa subir mais o texto
                const dyInicial = d.data.tipo === 'raiz' ? '-2.4em' : '-1.6em';
                linhas.forEach((linha, idx) => {
                    textoEl.append('tspan')
                        .attr('x', 0)
                        .attr('dy', idx === 0 ? '-3.3em' : '1.15em') // Aqui edita distância do texto da bolinha
                        .text(linha);
                });
            });

            nodeEnter.append('text')
                .attr('class', 'porcentagem-no')
                .attr('text-anchor', 'middle').attr('dy', '.35em')
                .text(d => `${d.data.porcentagem || 0}%`);

            const nodeUpdate = node.merge(nodeEnter);
            nodeUpdate.transition().duration(duration)
                .attr('transform', d => `translate(${d.y},${d.x})`);

            nodeUpdate.select('circle')
                .attr('r', d => d.data.tipo === 'raiz' ? 28 : (d.data.tipo === 'plano' ? 18 : (d.data.tipo === 'materia' ? 15 : 13)));

            nodeUpdate.attr('class', d => {
                let cls = `node nivel-${d.data.tipo} status-${d.data.status || 'adicionado'}`;
                if (d.data.tipo === 'raiz') cls += ' raiz';
                if (SUBTOPICO_ATUAL && d.data.tipo === 'subtopico' && d.data.refId === SUBTOPICO_ATUAL.id) cls += ' selecionado';
                return cls;
            });

            // Reaplica cor na raiz depois de qualquer mudança
            nodeUpdate.filter(d => d.data.tipo === 'raiz')
                .select('circle')
                .style('fill', corDaRaiz())
                .style('stroke', corDaRaiz());

            nodeUpdate.select('text.porcentagem-no').text(d => `${d.data.porcentagem || 0}%`);

            node.exit().transition().duration(duration)
                .attr('transform', () => `translate(${source.y},${source.x})`)
                .remove();

            nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
        }

        function diagonal(s, d) {
            const midY = (s.y + d.y) / 2;
            return `M ${s.y} ${s.x} C ${midY} ${s.x}, ${midY} ${d.x}, ${d.y} ${d.x}`;
        }

        function clicarNo(d) {
            if (d.data.tipo === 'raiz') return; // raiz não faz nada no clique esquerdo

            if (d.data.tipo === 'subtopico') {
                const sub = encontrarSubtopico(d.data.refId);
                if (sub) {
                    SUBTOPICO_ATUAL = sub;
                    atualizarSelecaoVisual();
                    selecionarSubtopico(d.data.refId);
                }
            } else {
                // Colapsa/expande
                if (d.children) {
                    d._children = d.children;
                    d.children = null;
                    NOS_EXPANDIDOS.delete(d.data.id);
                } else if (d._children) {
                    d.children = d._children;
                    d._children = null;
                    NOS_EXPANDIDOS.add(d.data.id);
                }
                atualizarMapa(d);
            }
        }

        function atualizarSelecaoVisual() {
            d3.selectAll('.node').classed('selecionado', function(d) {
                return SUBTOPICO_ATUAL && d.data.tipo === 'subtopico' && d.data.refId === SUBTOPICO_ATUAL.id;
            });
        }

        function zoomIn() { svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.4); }
        function zoomOut() { svg.transition().duration(300).call(zoomBehavior.scaleBy, 0.7); }
        function resetZoom() { svg.transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity); }
        function expandirTudo() {
            root.each(d => {
                if (d._children) { d.children = d._children; d._children = null; }
                if (d.depth >= 1) NOS_EXPANDIDOS.add(d.data.id);
            });
            atualizarMapa(root);
        }
        function colapsarTudo() {
            root.each(d => {
                if (d.depth >= 1 && d.children) { d._children = d.children; d.children = null; }
            });
            NOS_EXPANDIDOS.clear();
            atualizarMapa(root);
        }

        // ==========================================
        // DROPDOWN GERAL
        // ==========================================
        let dropdownAberto = null;

        function abrirDropdown(event, tipo, id, statusAtual) {
            event.stopPropagation();
            fecharDropdown();

            const dropdown = document.createElement('div');
            dropdown.className = 'dropdown-status';

            const filhos = {
                plano: { label: '➕ Nova matéria', acao: () => abrirCriacao('materia', id) },
                materia: { label: '➕ Novo tópico', acao: () => abrirCriacao('topico', id) },
                topico: { label: '➕ Novo subtópico', acao: () => abrirCriacao('subtopico', id) },
            };
            if (filhos[tipo]) {
                const add = document.createElement('div');
                add.className = 'item add';
                add.innerHTML = filhos[tipo].label;
                add.onclick = (e) => { e.stopPropagation(); fecharDropdown(); filhos[tipo].acao(); };
                dropdown.appendChild(add);
                dropdown.appendChild(sep());
            }

            if (tipo === 'topico' || tipo === 'subtopico') {
                const opcoes = [
                    { valor: 'adicionado', label: 'Adicionado', cor: '⚪' },
                    { valor: 'em_estudo',  label: 'Em estudo',  cor: '🟡' },
                    { valor: 'concluido',  label: 'Concluído',  cor: '🟢' },
                ];
                opcoes.forEach(op => {
                    const item = document.createElement('div');
                    item.className = 'item';
                    const check = op.valor === statusAtual ? '<span class="check">✓</span>' : '';
                    item.innerHTML = `${op.cor} ${op.label} ${check}`;
                    item.onclick = (e) => { e.stopPropagation(); mudarStatus(tipo, id, op.valor); };
                    dropdown.appendChild(item);
                });
                dropdown.appendChild(sep());
            }

            const recurso = tipo === 'plano' ? 'planos' : (tipo === 'materia' ? 'materias' : (tipo === 'topico' ? 'topicos' : 'subtopicos'));

            const itemEditar = document.createElement('div');
            itemEditar.className = 'item';
            itemEditar.innerHTML = '✏️ Editar';
            itemEditar.onclick = (e) => { e.stopPropagation(); fecharDropdown(); editarItem(recurso, id); };
            dropdown.appendChild(itemEditar);

            const itemExcluir = document.createElement('div');
            itemExcluir.className = 'item perigo';
            itemExcluir.innerHTML = '✕ Excluir';
            itemExcluir.onclick = (e) => { e.stopPropagation(); fecharDropdown(); excluirItem(recurso, id); };
            dropdown.appendChild(itemExcluir);

            document.body.appendChild(dropdown);
            posicionarDropdown(dropdown, event.target);
            dropdownAberto = dropdown;
        }

        function abrirDropdownRaiz(event) {
            event.stopPropagation();
            fecharDropdown();

            const dropdown = document.createElement('div');
            dropdown.className = 'dropdown-status';

            const itemNovoPlano = document.createElement('div');
            itemNovoPlano.className = 'item add';
            itemNovoPlano.innerHTML = '➕ Novo plano';

            dropdown.appendChild(itemNovoPlano);

            dropdown.appendChild(sep());

            const itemCor = document.createElement('div');
            itemCor.className = 'item';

        function mostrarSubmenuCores(dropdownPai) {
            // Limpa conteúdo e mostra só o submenu de cores
            dropdownPai.innerHTML = '';

            const voltar = document.createElement('div');
            voltar.className = 'voltar-submenu';
            voltar.innerHTML = '← Voltar';
            voltar.onclick = (e) => {
                e.stopPropagation();
                fecharDropdown();
                // Reabre o dropdown da raiz
                const ev = new MouseEvent('contextmenu', { bubbles: true });
                abrirDropdownRaiz(ev);
            };
            dropdownPai.appendChild(voltar);

            dropdownPai.appendChild(sep());

            const grid = document.createElement('div');
            grid.className = 'cores-grid';

            const corAtual = corDaRaiz();
            CORES_DISPONIVEIS.forEach(c => {
                const bola = document.createElement('div');
                bola.className = 'cor-bolinha' + (c.hex === corAtual ? ' ativa' : '');
                bola.style.background = c.hex;
                bola.title = c.nome;
                bola.onclick = async (e) => {
                    e.stopPropagation();
                    await trocarCorRaiz(c.hex);
                    fecharDropdown();
                };
                grid.appendChild(bola);
            });

            dropdownPai.appendChild(grid);
        }

        async function trocarCorRaiz(novaCor) {
            const resp = await apiFetch('/api/auth/me/cor', {
                method: 'PATCH',
                body: JSON.stringify({ cor_raiz: novaCor })
            });
            if (resp && resp.ok) {
                const usuarioAtualizado = await resp.json();
                USUARIO.cor_raiz = usuarioAtualizado.cor_raiz;
                localStorage.setItem('usuario', JSON.stringify(USUARIO));
                mostrarToast('Cor atualizada', 'success');
                // Reaplica cor sem re-renderizar a árvore (só atualiza o círculo da raiz)
                g.selectAll('g.node').filter(d => d.data && d.data.tipo === 'raiz')
                    .select('circle')
                    .transition().duration(300)
                    .style('fill', novaCor)
                    .style('stroke', novaCor);
            } else if (resp) {
                const err = await resp.json();
                mostrarToast(err.detail || 'Erro ao mudar cor', 'error');
            }
        }

        function sep() {
            const s = document.createElement('div');
            s.className = 'separador';
            return s;
        }

        function posicionarDropdown(dropdown, alvo) {
            const rect = alvo.getBoundingClientRect();
            let top = rect.bottom + 6;
            let left = rect.left;
            const ddRect = dropdown.getBoundingClientRect();
            if (left + ddRect.width > window.innerWidth - 10) left = window.innerWidth - ddRect.width - 10;
            if (top + ddRect.height > window.innerHeight - 10) top = rect.top - ddRect.height - 6;
            dropdown.style.top = `${top}px`;
            dropdown.style.left = `${left}px`;
        }

        function fecharDropdown() {
            if (dropdownAberto) { dropdownAberto.remove(); dropdownAberto = null; }
        }

        async function mudarStatus(tipo, id, novoStatus) {
            fecharDropdown();
            const recurso = tipo === 'topico' ? 'topicos' : 'subtopicos';
            const resp = await apiFetch(`/api/estudos/${recurso}/${id}/status`, {
                method: 'PATCH', body: JSON.stringify({ status: novoStatus })
            });
            if (resp && resp.ok) {
                mostrarToast('Status atualizado', 'success');
                await carregarArvore();
            } else if (resp) {
                const err = await resp.json();
                mostrarToast(err.detail || 'Erro', 'error');
            }
        }

        async function excluirItem(recurso, id) {
            if (!confirm('Tem certeza que quer excluir?')) return;
            const resp = await apiFetch(`/api/estudos/${recurso}/${id}`, { method: 'DELETE' });
            if (resp && resp.ok) {
                mostrarToast('Excluído', 'success');
                if (recurso === 'planos' && PLANO_ATUAL && PLANO_ATUAL.id === id) {
                    PLANO_ATUAL = null;
                    SUBTOPICO_ATUAL = null;
                }
                await carregarArvore();
            } else if (resp) {
                const err = await resp.json();
                mostrarToast(err.detail || 'Erro', 'error');
            }
        }

        function deletarItem(tipo, id) { return excluirItem(tipo, id); }

        // ==========================================
        // CONTEÚDO DO SUBTÓPICO
        // ==========================================
        function selecionarSubtopico(id) {
            const sub = encontrarSubtopico(id);
            if (!sub) return;
            SUBTOPICO_ATUAL = sub;

            document.getElementById('bem-vindo-conteudo').style.display = 'none';
            document.getElementById('conteudo-area').style.display = 'block';
            document.getElementById('titulo-subtopico').innerText = `📄 ${sub.numero || ''} ${sub.nome}`.trim();

            renderizarConteudos(sub);
            trocarTab('material');

            if (MODO === 'lista') renderizarLista();
            if (MODO === 'mapa') atualizarSelecaoVisual();
        }

        function encontrarSubtopico(id) {
            for (const plano of ARVORE)
                for (const mat of plano.materias)
                    for (const top of mat.topicos)
                        for (const sub of top.subtopicos)
                            if (sub.id === id) return sub;
            return null;
        }

        function renderizarConteudos(sub) {
            const tipos = { material: [], resumo: [], link: [], pdf: [] };
            sub.conteudos.forEach(c => { if (tipos[c.tipo]) tipos[c.tipo].push(c); });
            Object.keys(tipos).forEach(tipo => {
                const container = document.getElementById(`tab-${tipo}`);
                let html = '';
                if (!tipos[tipo].length) {
                    html = `<p style="color:#7f8c8d;">Nenhum conteúdo de <strong>${tipo}</strong> ainda.</p>`;
                } else {
                    tipos[tipo].forEach(c => {
                        html += `<div class="conteudo-bloco">
                            <button class="btn-del" onclick="deletarItem('conteudos', ${c.id})" title="Excluir">✕</button>
                            ${c.titulo ? `<h4>${escapeHtml(c.titulo)}</h4>` : ''}
                            ${renderizarCorpoConteudo(c, tipo)}
                        </div>`;
                    });
                }
                html += `<button class="tab-add-btn" onclick="abrirCriacaoConteudo('${tipo}')">+ Adicionar ${rotuloTipo(tipo)}</button>`;
                container.innerHTML = html;
            });
        }

        function renderizarCorpoConteudo(c, tipo) {
            let partes = [];
            if (c.texto) partes.push(`<p>${escapeHtml(c.texto).replace(/\n/g, '<br>')}</p>`);
            if (c.url_link) partes.push(`<a href="${escapeHtml(c.url_link)}" target="_blank" rel="noopener">${escapeHtml(c.url_link)}</a>`);
            if (c.url_arquivo) partes.push(`<a href="${escapeHtml(c.url_arquivo)}" target="_blank" rel="noopener">📎 Baixar arquivo anexado</a>`);
            return partes.join('') || '<em>Sem conteúdo.</em>';
        }

        function rotuloTipo(tipo) { return { material: 'Material', resumo: 'Resumo', link: 'Link', pdf: 'PDF' }[tipo]; }

        // ==========================================
        // TABS
        // ==========================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => trocarTab(btn.dataset.tab));
        });

        function trocarTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        // ==========================================
        // CRIAÇÃO
        // ==========================================
        function criarPlano() { abrirCriacao('plano', null); }

        function abrirCriacao(tipo, paiId) {
            TIPO_CRIACAO = tipo;
            CONTEXTO_CRIACAO = paiId;

            const titulos = {
                plano: 'Novo Plano de Estudos',
                materia: 'Nova Matéria',
                topico: 'Novo Tópico',
                subtopico: 'Novo Subtópico'
            };
            document.getElementById('modal-titulo').innerText = titulos[tipo];

            let campos = '';
            if (tipo === 'plano') {
                campos = `<label>Nome</label><input type="text" id="campo-nome" placeholder="Ex: Engenharia Elétrica" required>
                          <label>Descrição</label><textarea id="campo-descricao" placeholder="Opcional"></textarea>`;
            } else if (tipo === 'materia') {
                campos = `<label>Nome</label><input type="text" id="campo-nome" placeholder="Ex: Cálculo I" required>`;
            } else {
                campos = `<label>Número</label><input type="text" id="campo-numero" placeholder="Ex: 1 ou 1.1">
                          <label>Nome</label><input type="text" id="campo-nome" placeholder="Nome" required>`;
            }
            campos += `<label>Categoria</label><select id="campo-categoria">${optionsCategorias('')}</select>`;

            document.getElementById('modal-campos').innerHTML = campos;
            document.getElementById('campo-categoria').addEventListener('change', onCategoriaChange);
            document.getElementById('modal').style.display = 'flex';
        }

        function optionsCategorias(selecionadoId) {
            let html = `<option value="">— Sem categoria —</option>`;
            CATEGORIAS.forEach(c => {
                const sel = (String(c.id) === String(selecionadoId)) ? 'selected' : '';
                html += `<option value="${c.id}" ${sel}>${escapeHtml(c.nome)}</option>`;
            });
            html += `<option value="__nova__">➕ Criar nova categoria</option>`;
            return html;
        }

        function onCategoriaChange(e) {
            if (e.target.value === '__nova__') {
                e.target.value = '';
                CATEGORIA_VOLTAR_PARA_MODAL = true;
                abrirModalCategorias();
            }
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
            TIPO_CRIACAO = null;
            CONTEXTO_CRIACAO = null;
        }

        async function confirmarModal() {
            const nome = document.getElementById('campo-nome')?.value.trim();
            const descricao = document.getElementById('campo-descricao')?.value.trim();
            const numero = document.getElementById('campo-numero')?.value.trim();
            const catId = document.getElementById('campo-categoria')?.value;
            const categoria_id = catId && catId !== '__nova__' ? parseInt(catId) : null;

            if (!nome) { mostrarToast('Preencha o nome', 'error'); return; }

            const eraNovoPlano = TIPO_CRIACAO === 'plano';

            let url, body;
            if (TIPO_CRIACAO === 'plano') {
                url = '/api/estudos/planos';
                body = { nome, descricao: descricao || null, categoria_id };
            } else if (TIPO_CRIACAO === 'materia') {
                url = `/api/estudos/planos/${CONTEXTO_CRIACAO}/materias`;
                body = { nome, categoria_id };
            } else if (TIPO_CRIACAO === 'topico') {
                url = `/api/estudos/materias/${CONTEXTO_CRIACAO}/topicos`;
                body = { nome, numero: numero || null, categoria_id };
            } else if (TIPO_CRIACAO === 'subtopico') {
                url = `/api/estudos/topicos/${CONTEXTO_CRIACAO}/subtopicos`;
                body = { nome, numero: numero || null, categoria_id };
            }

            const resp = await apiFetch(url, { method: 'POST', body: JSON.stringify(body) });

            if (resp && resp.ok) {
                const criado = await resp.json();
                mostrarToast('Criado!', 'success');
                fecharModal();
                await carregarArvore();
                if (eraNovoPlano && criado && criado.id) {
                    // Expande automaticamente o novo plano no mapa
                    NOS_EXPANDIDOS.add(`plano-${criado.id}`);
                    selecionarPlano(criado.id);
                }
            } else if (resp) {
                const err = await resp.json();
                mostrarToast(err.detail || 'Erro', 'error');
            }
        }

        // ==========================================
        // EDIÇÃO (modal)
        // ==========================================
        function editarItem(recurso, id) {
            const item = buscarItem(recurso, id);
            if (!item) return;

            EDITANDO = { recurso, id };
            const tipo = recurso === 'planos' ? 'plano' : (recurso === 'materias' ? 'matéria' : (recurso === 'topicos' ? 'tópico' : 'subtópico'));
            document.getElementById('modal-editar-titulo').innerText = `Editar ${tipo}`;

            let campos = '';
            if (recurso === 'planos') {
                campos = `<label>Nome</label><input type="text" id="edit-nome" value="${escapeAtributo(item.nome)}">
                          <label>Descrição</label><textarea id="edit-descricao">${escapeHtml(item.descricao || '')}</textarea>`;
            } else if (recurso === 'materias') {
                campos = `<label>Nome</label><input type="text" id="edit-nome" value="${escapeAtributo(item.nome)}">`;
            } else {
                campos = `<label>Número</label><input type="text" id="edit-numero" value="${escapeAtributo(item.numero || '')}">
                          <label>Nome</label><input type="text" id="edit-nome" value="${escapeAtributo(item.nome)}">`;
            }
            const catId = item.categoria ? item.categoria.id : '';
            campos += `<label>Categoria</label><select id="edit-categoria">${optionsCategorias(catId)}</select>`;

            document.getElementById('modal-editar-campos').innerHTML = campos;
            document.getElementById('edit-categoria').addEventListener('change', onCategoriaChange);
            document.getElementById('modal-editar').style.display = 'flex';
        }

        function fecharModalEditar() {
            document.getElementById('modal-editar').style.display = 'none';
            EDITANDO = null;
        }

        async function confirmarModalEditar() {
            if (!EDITANDO) return;
            const { recurso, id } = EDITANDO;
            const nome = document.getElementById('edit-nome')?.value.trim();
            const numero = document.getElementById('edit-numero')?.value.trim();
            const descricao = document.getElementById('edit-descricao')?.value.trim();
            const catId = document.getElementById('edit-categoria')?.value;
            const categoria_id = catId ? parseInt(catId) : null;

            if (!nome) { mostrarToast('Nome obrigatório', 'error'); return; }

            const body = { nome, categoria_id };
            if (numero !== undefined) body.numero = numero || null;
            if (descricao !== undefined) body.descricao = descricao || null;

            const resp = await apiFetch(`/api/estudos/${recurso}/${id}`, {
                method: 'PATCH', body: JSON.stringify(body)
            });
            if (resp && resp.ok) {
                mostrarToast('Salvo!', 'success');
                fecharModalEditar();
                await carregarArvore();
            } else if (resp) {
                const err = await resp.json();
                mostrarToast(err.detail || 'Erro', 'error');
            }
        }

        function buscarItem(recurso, id) {
            if (recurso === 'planos') return ARVORE.find(p => p.id === id);
            for (const p of ARVORE)
                for (const m of p.materias) {
                    if (recurso === 'materias' && m.id === id) return m;
                    for (const t of m.topicos) {
                        if (recurso === 'topicos' && t.id === id) return t;
                        for (const s of t.subtopicos) {
                            if (recurso === 'subtopicos' && s.id === id) return s;
                        }
                    }
                }
            return null;
        }

        // ==========================================
        // CATEGORIAS
        // ==========================================
        function renderizarListaCategorias() {
            const container = document.getElementById('lista-categorias');
            if (!container) return;
            container.innerHTML = CATEGORIAS.map(c => `
                <div class="cat-linha">
                    <input type="text" value="${escapeAtributo(c.nome)}" data-id="${c.id}"
                        onblur="salvarCategoriaInline(${c.id}, this.value)"
                        onkeydown="if(event.key==='Enter') this.blur();">
                    <button class="btn-acao excluir" onclick="excluirCategoria(${c.id})" title="Excluir">✕</button>
                </div>
            `).join('') || '<p style="color:#7f8c8d; font-size:0.9rem;">Nenhuma categoria ainda.</p>';
        }

        function renderizarListaCategoriasModal() {
            const container = document.getElementById('modal-categorias-lista');
            if (!container) return;
            container.innerHTML = CATEGORIAS.map(c => `
                <div class="cat-linha">
                    <input type="text" value="${escapeAtributo(c.nome)}" data-id="${c.id}"
                        onblur="salvarCategoriaInline(${c.id}, this.value)"
                        onkeydown="if(event.key==='Enter') this.blur();">
                    <button class="btn-acao excluir" onclick="excluirCategoria(${c.id})" title="Excluir">✕</button>
                </div>
            `).join('') || '<p style="color:#7f8c8d; font-size:0.9rem;">Nenhuma categoria ainda.</p>';
        }

        async function salvarCategoriaInline(id, novoNome) {
            const nome = (novoNome || '').trim();
            if (!nome) { await carregarCategorias(); return; }
            const atual = CATEGORIAS.find(c => c.id === id);
            if (atual && atual.nome === nome) return;

            const resp = await apiFetch(`/api/estudos/categorias/${id}`, {
                method: 'PATCH', body: JSON.stringify({ nome })
            });
            if (resp && resp.ok) {
                mostrarToast('Categoria atualizada', 'success');
                await carregarCategorias();
                await carregarArvore();
            } else if (resp) {
                const err = await resp.json();
                mostrarToast(err.detail || 'Erro', 'error');
                await carregarCategorias();
            }
        }

        async function adicionarCategoriaVazia() {
            const resp = await apiFetch('/api/estudos/categorias', {
                method: 'POST', body: JSON.stringify({ nome: 'Nova categoria' })
            });
            if (resp && resp.ok) {
                await carregarCategorias();
                setTimeout(() => {
                    const inputs = document.querySelectorAll('.cat-linha input');
                    if (inputs.length) {
                        const ultimo = inputs[inputs.length - 1];
                        ultimo.focus();
                        ultimo.select();
                    }
                }, 100);
            } else if (resp) {
                const err = await resp.json();
                mostrarToast(err.detail || 'Erro', 'error');
            }
        }

        async function excluirCategoria(id) {
            if (!confirm('Excluir esta categoria? Os itens que usam ela vão ficar sem categoria.')) return;
            const resp = await apiFetch(`/api/estudos/categorias/${id}`, { method: 'DELETE' });
            if (resp && resp.ok) {
                mostrarToast('Categoria excluída', 'success');
                await carregarCategorias();
                await carregarArvore();
            } else if (resp) {
                const err = await resp.json();
                mostrarToast(err.detail || 'Erro', 'error');
            }
        }

        function abrirModalCategorias() {
            renderizarListaCategoriasModal();
            document.getElementById('modal-categorias').style.display = 'flex';
        }

        function fecharModalCategorias() {
            document.getElementById('modal-categorias').style.display = 'none';
            renderizarListaCategorias();

            if (CATEGORIA_VOLTAR_PARA_MODAL) {
                const selectCriar = document.getElementById('campo-categoria');
                if (selectCriar) selectCriar.innerHTML = optionsCategorias(selectCriar.value);

                const selectEditar = document.getElementById('edit-categoria');
                if (selectEditar) selectEditar.innerHTML = optionsCategorias(selectEditar.value);

                if (CATEGORIAS.length) {
                    const ultima = CATEGORIAS[CATEGORIAS.length - 1];
                    if (selectCriar) selectCriar.value = ultima.id;
                    if (selectEditar) selectEditar.value = ultima.id;
                }
                CATEGORIA_VOLTAR_PARA_MODAL = false;
            }
        }

        // ==========================================
        // MODAL CONTEÚDO
        // ==========================================
        function abrirCriacaoConteudo(tipo) {
            if (!SUBTOPICO_ATUAL) { mostrarToast('Selecione um subtópico', 'error'); return; }
            TIPO_CONTEUDO = tipo;
            document.getElementById('modal-conteudo-titulo').innerText = `Adicionar ${rotuloTipo(tipo)}`;

            let campos = `<label>Título</label><input type="text" id="conteudo-titulo" placeholder="Opcional">`;
            if (tipo === 'link') {
                campos += `<label>URL</label><input type="url" id="conteudo-link" placeholder="https://...">`;
            } else {
                campos += `<label>Texto</label><textarea id="conteudo-texto" placeholder="Opcional..."></textarea>`;
                campos += `<label>Arquivo</label><input type="file" id="conteudo-arquivo" accept=".pdf,.docx,.jpg,.jpeg,.png">`;
            }
            document.getElementById('modal-conteudo-campos').innerHTML = campos;
            document.getElementById('modal-conteudo').style.display = 'flex';
        }

        function fecharModalConteudo() {
            document.getElementById('modal-conteudo').style.display = 'none';
            TIPO_CONTEUDO = null;
        }

        async function confirmarModalConteudo() {
            const titulo = document.getElementById('conteudo-titulo')?.value.trim();
            const texto = document.getElementById('conteudo-texto')?.value.trim();
            const link = document.getElementById('conteudo-link')?.value.trim();
            const arquivo = document.getElementById('conteudo-arquivo')?.files[0];

            if (TIPO_CONTEUDO === 'link' && !link) { mostrarToast('Informe o link', 'error'); return; }
            if (!texto && !arquivo && !link) { mostrarToast('Preencha texto ou arquivo', 'error'); return; }

            const formData = new FormData();
            formData.append('tipo', TIPO_CONTEUDO);
            if (titulo) formData.append('titulo', titulo);
            if (texto) formData.append('texto', texto);
            if (link) formData.append('url_link', link);
            if (arquivo) formData.append('arquivo', arquivo);

            const resp = await apiFetch(`/api/estudos/subtopicos/${SUBTOPICO_ATUAL.id}/conteudo`, {
                method: 'POST', body: formData
            });
            if (resp && resp.ok) {
                mostrarToast('Conteúdo adicionado!', 'success');
                fecharModalConteudo();
                await carregarArvore();
            } else if (resp) {
                const err = await resp.json();
                mostrarToast(err.detail || 'Erro', 'error');
            }
        }

        // ==========================================
        // HELPERS
        // ==========================================
        function escapeHtml(texto) {
            if (texto == null) return '';
            return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeAtributo(texto) {
            if (texto == null) return '';
            return String(texto).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        window.addEventListener('resize', () => {
            if (MODO === 'mapa') {
                const svgEl = document.getElementById('mapa-svg');
                if (svgEl.style.display !== 'none') {
                    clearTimeout(window.__resizeTimer);
                    window.__resizeTimer = setTimeout(() => renderizarMapa(), 200);
                }
            }
        });
    </script>
</body>
</html>
